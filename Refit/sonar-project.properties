# Run pysonar from the Refit directory. Keep the existing dashboard history.
sonar.projectKey=Refit
sonar.projectName=QAT Refit

# Analyse all backend implementation files; classify tests separately.
# React is outside the backend quality exercise.
sonar.sources=backend/app
sonar.tests=backend/tests
sonar.python.version=3.10
sonar.sourceEncoding=UTF-8

# Exclude generated Python environments and caches from both scopes.
sonar.exclusions=**/.venv/**,**/venv/**,**/.pytest_cache/**,**/__pycache__/**,**/*.pyc,**/*.pyo
sonar.test.exclusions=**/.venv/**,**/venv/**,**/.pytest_cache/**,**/__pycache__/**,**/*.pyc,**/*.pyo

# Generated by the README pytest command; relative to this directory.
sonar.python.coverage.reportPaths=coverage.xml


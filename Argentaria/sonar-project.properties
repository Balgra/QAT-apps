# Run pysonar from the Argentaria directory. Keep the existing dashboard history.
sonar.projectKey=Arg
sonar.projectName=QAT Argentaria

# Include startup/session-data handling as well as all backend packages.
# Tkinter presentation code is outside the backend quality exercise.
sonar.sources=app.py,domain,services,repository
sonar.tests=tests
sonar.python.version=3.10
sonar.sourceEncoding=UTF-8

# Exclude generated Python environments and caches from both scopes.
sonar.exclusions=**/.venv/**,**/venv/**,**/.pytest_cache/**,**/__pycache__/**,**/*.pyc,**/*.pyo
sonar.test.exclusions=**/.venv/**,**/venv/**,**/.pytest_cache/**,**/__pycache__/**,**/*.pyc,**/*.pyo

# Generated by the README pytest command; relative to this directory.
sonar.python.coverage.reportPaths=coverage.xml

